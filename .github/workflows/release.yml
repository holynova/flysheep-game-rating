name: Build release asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the asset to (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build the extension zip
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: zip -r "flysheep-game-rating-${TAG}.zip" LICENSE README.md icons manifest.json src

      - name: Upload the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "flysheep-game-rating-${TAG}.zip" --clobber
